role: Founding Director, Artificial Intelligence Institute
bio: |
  Dr. Mehmet Haklıdır is the founding Director of the TÜBİTAK BİLGEM Artificial Intelligence Institute,
  Türkiye's first national AI institute. He holds a Ph.D. in Control and Automation Engineering from
  Istanbul Technical University and has more than 24 years of experience in AI, autonomous systems, big
  data, simulation, and technology policy.

  He contributed to Türkiye's first National AI Strategy and led the technical preparation and
  coordination of the National Artificial Intelligence Action Plan 2026–2030, finalized through
  consultation with the national AI ecosystem. He serves on the Steering Committee of the Science,
  Technology and Innovation Policies Council of the Presidency of the Republic of Türkiye and is a member
  of several international AI governance initiatives, including OECD ONE AI, GPAI, UNESCO AI Ethics,
  NATO DAIRB, and the European AI Alliance.

  His current research focuses on large language models, AI safety with an emphasis on agentic AI
  systems, deep reinforcement learning, robotics, and autonomous decision-making under uncertainty.

