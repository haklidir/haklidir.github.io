name: Notify search engines (IndexNow)

# After each successful deploy, tell IndexNow (Bing and partners) which pages changed.
# Run it by hand with "all" ticked to submit every URL in the sitemap.
on:
  workflow_run:
    workflows: ['Deploy website to GitHub Pages']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      all:
        description: 'Submit every URL in the sitemap'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  indexnow:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Submit URLs
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.all }}" = "true" ]; then
            python3 scripts/indexnow.py --all
          else
            python3 scripts/indexnow.py HEAD~1 HEAD
          fi
