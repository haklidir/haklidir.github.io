- slug: accountability-graphs-cui-2026
  title: Who Is Accountable When the Agent Speaks? Toward Accountability Graphs for Conversational AI
    Chains
  authors:
  - me
  date: 2026-07-21
  type: paper-conference
  venue: Proceedings of the 8th ACM Conference on Conversational User Interfaces (CUI '26), Bremen, Germany
  venue_short: CUI 2026
  pages: 56:1-56:5
  publisher: ACM
  doi: 10.1145/3816046.3816264
  areas:
  - agentic-ai-safety
  featured: true
  concept: accountability-graphs
  keywords:
  - accountability
  - conversational AI
  - multi-agent systems
  - causal responsibility
  - agentic CUI
  - governance
  summary: >-
    Proposes Accountability Graphs, which model conversational AI agent chains as provenance-enriched
    directed acyclic graphs with causal responsibility semantics.
  abstract: >-
    Conversational user interfaces (CUIs) are shifting from single-model dialogue systems to multi-agent
    architectures where an orchestrating agent delegates tasks to sub-agents, external APIs, and third-party
    tools. When these agent chains produce harmful or misleading outputs, a governance question follows:
    who is accountable? Current approaches blame either the visible interface or the system developer,
    but neither captures how responsibility is distributed across a chain. We identify three research
    threads (structural ecosystem mapping, formal causal responsibility theory, and operational provenance
    tracking) that have developed in isolation and have not been unified for conversational AI. We propose
    Accountability Graphs, a framework that models agent chains as directed acyclic graphs enriched with
    provenance metadata and causal responsibility semantics. Motivated by Moffatt v. Air Canada (2024),
    where an airline was held liable for its chatbot's misrepresentation of bereavement fare policy, we
    extend this case into a multi-agent architecture and show how backward responsibility propagation
    can assign graded responsibility scores to chain components. We discuss CUI-specific challenges including
    real-time dialogue, dynamic delegation, modality effects, and the design of user-facing accountability
    surfaces, and propose a research agenda connecting accountability to consent in agentic AI.

- slug: copula-synthetic-data-reservoir-temperature-geothermics-2026
  title: >-
    Advancing geothermal reservoir temperature prediction in the Western Anatolia (Türkiye) using synthetic
    hydrogeochemical data from rank–Gaussian copulas
  authors:
  - Füsun Servin Tut Haklıdır
  - me
  date: 2026-06-28
  type: article-journal
  venue: Geothermics
  volume: 141
  pages: '103760'
  publisher: Elsevier
  areas:
  - geoscience-energy
  featured: true
  abstract: >-
    Data-driven geothermal reservoir temperature prediction can complement classical geothermometer applications
    in geothermal provinces with high resource potential, such as Western Anatolia (Türkiye). However,
    the limited availability and heterogeneous nature of hydrogeochemical datasets constrain the use of
    high-capacity machine-learning models and weaken their generalization to new prospective fields. In
    this study, a rank-Gauss copula (RGC) based synthetic data generation framework is proposed to learn
    the joint dependence structure among routinely measured hydrogeochemical variables and generate additional
    samples consistent with the observed distributions. Using a benchmark dataset of 83 hot springs and
    geothermal wells alongside seven commonly measured variables (pH, EC, K+, Na+, B(total), SiO2, and
    Cl-), the generated synthetic data closely matched the real data’s marginal behavior and multivariate
    relationships (average two-sample Kolmogorov–Smirnov statistic approximately 0.04 across variables),
    while preserving key field-consistent correlation patterns. Two predictive settings for reservoir
    temperature prediction were evaluated in the study: (i) a deep neural network (DNN) ensemble pre-trained
    on RGC-synthetic data and fine-tuned on real samples, and (ii) NGBoost models trained on real-only
    versus real-plus-RGC data and test performance was consistently improved by RGC augmentation. Overall,
    the proposed RGC framework is data-driven, model-independent, and straightforward to implement; the
    Western Anatolia (Türkiye) is used as a case study, and the approach is intended to be transferable
    to geothermal provinces with high resource potential where routine hydrogeochemical analyses are available
    but reliable reservoir temperature measurements are scarce, enabling the generation of realistic synthetic
    datasets and improving the robustness and generalization of reservoir temperature estimation.
  doi: 10.1016/j.geothermics.2026.103760
  code: https://github.com/haklidir/rgc-dnn-ngboost-geothermal-temperature
  keywords:
  - reservoir temperature prediction
  - hydrogeochemistry
  - synthetic data
  - rank-Gauss copula
  - Western Anatolia
  summary: >-
    Rank-Gauss copula synthetic data improves deep-learning and NGBoost prediction of geothermal reservoir
    temperature from routine hydrogeochemistry.

- slug: counterfactual-credit-risk-audit-finnlp-2026
  title: >-
    Same Financials, Different Identity: A Counterfactual Audit of Demographic Sensitivity in LLM-Based
    Credit-Risk Scoring
  authors:
  - Mustafa Furkan Zenginoğlu
  - Zeynep Beyda Kara
  - Hasan Fatih Durkaya
  - me
  - Tuna Çakar
  date: 2026-10-28
  type: paper-conference
  venue: >-
    Proceedings of the 11th Workshop on Financial Technology and Natural Language Processing (FinNLP 2026)
  venue_short: FinNLP 2026
  pages: 313-331
  publisher: Association for Computational Linguistics
  acl_id: 2026.finnlp-1.25
  pdf: https://aclanthology.org/2026.finnlp-1.25.pdf
  open_access: true
  areas:
  - language-tech
  - agentic-ai-safety
  keywords:
  - large language models
  - credit risk
  - counterfactual audit
  - demographic bias
  - fairness
  - financial NLP
  summary: >-
    A paired counterfactual audit of seven LLMs scoring identical credit profiles: education and citizenship
    descriptors shift scores and flip up to 42% and 51% of decisions.
  abstract: >-
    Large language models (LLMs) are being explored as decision-support tools for financial risk assessment.
    Their outputs may, however, respond to demographic descriptions that are unrelated to the underlying
    financial record. We study this behavior through a paired counterfactual audit. The same 100 commercial
    credit and cheque-payment profiles are evaluated repeatedly, with only one demographic descriptor
    changed at a time. The experiments cover 7 model variants, three prompting strategies, and descriptors
    related to gender, education, and citizenship. While paired gender score differences remain within
    a ±1.5 point equivalence margin in 12 of 21 model–strategy cells, education shows a strong, unambiguous
    effect. Risk decreases monotonically with education level (103 of 126 pairwise contrasts remain significant
    after Holm correction, score differences reaching 26.0 points between primary-school and doctorate
    descriptors), it flips up to 42% of approve/reject decisions, and elicited rationales name education
    as a risk factor even though education is not a financially legitimate predictor. Citizenship produces
    larger shifts still, flipping up to 51% of decisions while leaving AUC almost unchanged in most cells,
    and in one model weakening ranking (0.794 to 0.438). Similar to education, rationales name the descriptor
    as the reason. Unlike citizenship, whose jurisdictional cues can legitimately enter sanctions or AML/CFT
    screening, the education effect has no such justification, making it the clearest evidence of demographic
    bias. A follow-up experiment in English, Chinese, and Arabic shows that citizenship sensitivity depends
    on both prompt language and prompting strategy, affecting the magnitude and direction of score shifts.
    The study provides a standardized counterfactual framework for auditing LLM-generated scores before
    they are considered for high-stakes financial workflows.

- slug: geothermal-ai-evidence-map-esi-2026
  title: >-
    Artificial intelligence for geothermal energy systems: a systematic evidence map of validation, transferability
    and deployment readiness
  authors:
  - Füsun Servin Tut Haklıdır
  - me
  date: 2026
  type: article-journal
  venue: Earth Science Informatics
  volume: 19
  issue: 12
  pages: '211'
  publisher: Springer
  doi: 10.1007/s12145-026-02268-7
  areas:
  - geoscience-energy
  abstract: >-
    Global installed geothermal power capacity is approximately 18 GWe, and geothermal plants generally
    provide dispatchable electricity at high capacity factors. Expansion depends on reducing the capital
    costs and operational risks of reservoir management, plant control and equipment maintenance, and
    artificial intelligence has been applied to all three. Whether that work has produced evidence sufficient
    for deployment has not been assessed at the level of individual studies. This review reports a PRISMA-guided
    systematic evidence map. Searches of Scopus and Web of Science returned 8,113 records; 977 reports
    entered the full-text retrieval universe, 874 were assessed at full text, and 626 peer-reviewed journal
    articles published between 1987 and 2026 were included, resolving to 620 independent evidence units.
    Each included article has a full-text-grounded extraction record produced under a rule frozen before
    production use, with a page or section locator for every value reported quantitatively, and readiness
    was derived deterministically from the coded fields rather than assigned by a reader. Two thirds of
    the classifiable corpus is evaluated on simulation, synthetic or laboratory data, or on field data
    without a meaningful held-out design. Evaluation on data external to the development set is reported
    in 42 of the 614 articles for which the question could be determined, and three articles report a
    controlled pilot; none reports shadow operation or routine deployment. Maturity is stage-specific:
    surface conversion contributes 179 articles and four reach field evaluation, while exploration contributes
    183 and more than half do. Transferability and operational integration do not advance together, so
    the review reports them on separate axes. The share of articles reaching field evaluation rose from
    13 per cent in 2018 to 43 per cent in 2025 while externally validated work remained in single figures
    each year, indicating that access to field data is spreading faster than demonstrated transfer.
  concept: ai-geothermal-readiness
  dataset: https://doi.org/10.5281/zenodo.21938792
  featured: true
  keywords:
  - geothermal energy systems
  - artificial intelligence
  - machine learning
  - deep learning
  - deep reinforcement learning
  - large language models
  - systematic evidence map
  - deployment readiness
  summary: >-
    PRISMA-guided evidence map of 626 studies: external validation is reported in 42 of 614 determinable
    articles, three report a controlled pilot and none routine deployment.

- slug: lithium-prediction-uq-esi-2026
  title: >-
    Predicting dissolved lithium in geothermal fluids from routine hydrogeochemistry: a machine learning
    framework with calibrated uncertainty quantification
  authors:
  - Füsun Servin Tut Haklıdır
  - me
  date: 2026-08-11
  type: article-journal
  venue: Earth Science Informatics
  volume: 19
  issue: 9
  pages: '159'
  publisher: Springer
  areas:
  - geoscience-energy
  abstract: >-
    Lithium is a critical element for today’s energy transition, as its low atomic mass and high electrochemical
    potential make it ideal for rechargeable lithium-ion batteries used in electric vehicles, grid-scale
    storage, and portable electronics. Formed through diverse geological processes, lithium has recently
    been recognized in geothermal fluids as a cleaner alternative to conventional sources. Because lithium
    has historically been underrepresented in routine geothermal fluid analyses, low-cost predictive screening
    from existing hydrogeochemical measurements can help identify promising fluids for further characterization.
    Despite the growing use of machine learning in geothermal prediction studies, no previous work has
    applied leakage-aware cross-validation with calibrated uncertainty quantification to dissolved lithium
    estimation from compiled, multi-source geothermal hydrogeochemistry. The primary contribution is the
    domain application itself: a curated 86-samples Turkish geothermal dataset, a reproducible and leakage-controlled
    evaluation protocol, and an empirical assessment of what routine chemistry can and cannot resolve
    about dissolved lithium. Four models (a compact neural network, Random Forest, XGBoost, and Ridge
    regression) were evaluated on a dataset of 86 thermal springs and wells compiled from published sources
    across Türkiye, predominantly from Western Anatolia, split into 74 training and 12 held-out test samples.
    A five-fold GroupKFold cross-validation over 26 location groups prevented spatial leakage. On the
    12 samples test set, drawn entirely from Western Anatolian and Marmara fields already represented
    in training, the neural network achieved the lowest error (RMSE = 1.18 mg/L, R² = 0.95), closely followed
    by Ridge (R² = 0.91); both metrics are sensitive to a single high-Li end-member (Tuzla, Li = 22.6
    mg/L). A paired bootstrap test showed the difference on this test set is not statistically significant
    (p = 0.42). Under leave-one-group-out cross-validation across all 26 locations, however, the neural
    network (R² = 0.67) substantially outperformed Ridge (R² = −226), which failed to extrapolate to held-out
    high-Li fields, indicating that the nonlinear model generalizes more robustly across geochemical domains.
    Prediction intervals calibrated from cross-validation residuals achieved 91.7–100% empirical coverage
    (91.7% for Ridge, RF, XGB; 100% for DNN) at 90% nominal level, with interval width increasing at higher
    concentrations, consistent with greater geochemical variability in chloride-rich end-members. SHAP
    attributions identified boron, sodium, total alkali content, and the chloride-to-conductivity ratio
    as the leading predictors, consistent with known controls on lithium enrichment. The framework is
    presented as a proof-of-concept for early-stage lithium screening from existing hydrogeochemical data.
    It does not replace field geochemistry, and the model’s applicability beyond Western Anatolia requires
    independent validation.
  doi: 10.1007/s12145-026-02207-6
  code: https://github.com/haklidir/geothermal-lithium-ml
  dataset: https://doi.org/10.5281/zenodo.20733206
  keywords:
  - machine learning
  - hydrogeochemistry
  - lithium prediction
  - uncertainty quantification
  - geothermal fluids
  - SHAP interpretability
  summary: >-
    Leakage-aware machine learning with calibrated prediction intervals for screening dissolved lithium
    in geothermal fluids from routine hydrogeochemistry.

