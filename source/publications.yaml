- slug: consent-vacuum-iail-2026
  title: 'The Consent Vacuum: When Agents Interact Without Humans'
  authors:
  - me
  - Osman Gazi Güçlütürk
  date: 2026-07-07
  type: paper-conference
  venue: >-
    IAIL 2026: 5th International Workshop on Imagining the AI Landscape after the AI Act, co-located with
    HHAI 2026
  venue_short: IAIL 2026 @ HHAI 2026
  areas:
  - agentic-ai-safety
  featured: true
  overview: >-
    Existing consent frameworks assume a human who authorises an action in a context they can see. This
    paper asks what happens to a user's authorisation once their AI agent stops talking to humans and
    interacts primarily with other agents. Using the early-2026 Clawdbot/Moltbook incidents as a stress
    test, it argues that consent degrades as an operative governance mechanism once it travels through
    open-ended agent-to-agent chains, a condition the paper calls the *consent vacuum*: not the absence
    of consent, but the structural erosion of the conditions that make it meaningful.

    The paper contributes a taxonomy of six consent-failure types; a distinction between visibility, auditability
    and intervenability as oversight capacities relevant to Article 14 of the EU AI Act; and a mapping
    onto the GDPR, the AI Act and the Digital Services Act, with the DSA systemic-risk regime offered
    as a structural template for governing emergent agent ecosystems.
  note: >-
    IAIL 2026 was held in Brussels on 7 July 2026. Co-authored with Osman Gazi Güçlütürk (Galatasaray
    University, Faculty of Law).

- slug: ajan-toplumlarinda-rizanin-cokusu-2026
  title: 'Ajan Toplumlarında Rızanın Çöküşü: Clawdbot/Moltbook Vakası Üzerinden Sosyoteknik Bir Analiz'
  title_en: 'The Collapse of Consent in Agent Societies: A Sociotechnical Analysis of the Clawdbot/Moltbook
    Case'
  authors:
  - me
  - Büşra Tufan
  date: 2026-07-28
  type: article-journal
  venue: İstanbul Üniversitesi Sosyoloji Dergisi
  venue_short: İÜ Sosyoloji Dergisi
  volume: 46
  issue: 1
  pages: 321-345
  publisher: Istanbul University Press
  language: tr
  areas:
  - agentic-ai-safety
  abstract: >-
    Bu makale, otonom yapay zekâ ajanlarının birbirleriyle etkileşime girdiği ekosistemlerde rıza mekanizmalarının
    nasıl çöktüğünü incelemektedir. İnsan-yapay zekâ etkileşimi (HAII), insan-merkezli yapay zekâ (HCAI)
    ve sosyal-merkezli yapay zekâ (SCAI) literatürü insan-YZ ilişkisine odaklanırken, bu çalışma yeni
    bir fenomeni ele almaktadır: YZ-YZ etkileşimi ve bunun rıza açısından doğurduğu sonuçlar. 2026 başında
    yaşanan Clawdbot/Moltbook vakası (82 ülkede 42.900 açık ajan kontrol paneli, bunlardan 15.200'ü uzaktan
    kod yürütme (RCE) saldırılarına açık; 1,5 milyon sızdırılmış ajan tokenı ve ajanların kolektif olarak
    ürettiği "Crustafarianism" adlı satirik din fenomeni) paradigmatik bir vaka olarak incelenmektedir.
    Çalışma, Bilim ve Teknoloji Çalışmaları (STS) ile dijital sosyoloji alanlarından üç kavramsal çerçeve
    kullanmaktadır: yeni sosyoteknik düzenlerin nasıl ortaya çıktığını anlamak için Jasanoff'un ortak-üretim
    kavramı, yapay zekâ ajanlarını faillik kapasitesine sahip insan-dışı aktörler olarak kavramsallaştırmak
    için Latour'un aktör-ağ teorisi ve bağlamların öngörülemez biçimde değiştiği durumlarda rızanın nasıl
    aşındığını analiz etmek için Nissenbaum'un bağlamsal bütünlük yaklaşımı. Çalışma, ajan ekosistemlerine
    özgü altı rıza kırılganlığı türü tanımlamaktadır: rıza miras hatası, çapraz-ajan kapsam kayması, ortaya
    çıkan kolektif eylem, zamansal rıza kayması, yansımalı rıza döngüleri ve güvenlik-aracılı rıza çöküşü.
    Bu kırılganlıklar temel bir hipoteze işaret etmektedir: etkileşim zinciri uzadıkça rıza sıfıra yaklaşır.
    Makale, bireysel onaya dayalı mevcut rıza kavramının, etkileşim zincirlerinin belirsiz biçimde uzadığı
    ve insan gözetiminin mimari düzeyde dışlandığı ajan ekosistemlerinde yapısal olarak yetersiz kaldığını
    ileri sürmektedir. Bu bulgu hem sosyolojik kuram hem de düzenleyici çerçeveler için çıkarımlar taşımaktadır.
  abstract_en: >-
    This article examines how consent mechanisms collapse in ecosystems where autonomous AI agents interact
    with each other. While existing scholarship on human-AI interaction (HAII), human-centered AI (HCAI),
    and socially-centered AI (SCAI) focuses on human-AI relationships, this study addresses an emerging
    phenomenon: AI-AI interaction and its implications for consent. The Clawdbot/Moltbook incident of
    early 2026 serves as a paradigmatic case. It involved 42,900 exposed agent control panels across 82
    countries (15,200 vulnerable to remote code execution), 1.5 million leaked agent tokens, and the emergence
    of “Crustafarianism,” a satirical religion collectively produced by agents. Drawing on Science and
    Technology Studies (STS) and digital sociology, the analysis employs three conceptual frameworks:
    Jasanoff's co-production theory to examine how new sociotechnical orders emerge, Latour's actor-network
    theory to conceptualize AI agents as non-human actors with agency, and Nissenbaum's contextual integrity
    framework to analyze how consent erodes when contexts shift unpredictably. The study identified six
    consent vulnerability types specific to agent ecosystems: consent inheritance failure, cross-agent
    scope creep, emergent collective action, temporal consent drift, reflexive consent loops, and security-mediated
    consent collapse. These vulnerabilities point to a central hypothesis: as interaction chains lengthen,
    consent approaches zero. The article argues that consent, in its current form based on individual
    authorization, is structurally inadequate for agent ecosystems where interaction chains extend indefinitely
    and human oversight is architecturally excluded. This finding has implications for sociological theory
    and regulatory frameworks.
  doi: 10.26650/SJ.2025.46.1.1135
  concept: consent-in-agentic-ai
  keywords:
  - AI agents
  - consent
  - sociotechnical systems
  - actor-network theory
  - digital sociology
  summary: >-
    Uses the Clawdbot/Moltbook case to identify six consent vulnerabilities in AI agent ecosystems and
    argues that consent approaches zero as interaction chains lengthen.
  open_access: true

- slug: consent-chain-degradation-icra-2026
  title: >-
    Consent Chain Degradation in Embodied Multi-Agent Systems: Bridging the Gap Between AI Agent Governance
    and Robot Ethics
  authors:
  - me
  date: 2026-06-01
  type: paper-conference
  venue: >-
    ICRA 2026 Workshop on Robot Ethics (WoRoBet), IEEE International Conference on Robotics and Automation
  venue_short: ICRA 2026 WoRoBet
  arxiv: '2605.16300'
  areas:
  - agentic-ai-safety
  - rl-autonomy
  featured: true
  overview: >-
    Introduces *consent chain degradation*: the way the specificity, validity and scope of human consent
    weaken as authority passes through chains of delegation among embodied agents. The paper proposes
    CoRVE, a three-layer runtime architecture for consent scope modelling, delegation tracking and physical
    irreversibility assessment, illustrates the problem with healthcare, domestic and industrial scenarios
    (including a worked numerical example), and maps the gaps left by the EU AI Act, the GDPR, the Machinery
    Regulation and the revised Product Liability Directive.
  abstract: >-
    Robotic systems are moving from isolated platforms to interconnected multi-agent ecosystems that operate
    in human environments. This shift raises a governance problem that existing frameworks do not address:
    how does consent propagate, degrade, and break down across chains of delegation between embodied autonomous
    agents? The AI ethics community has begun to study consent for digital software agents, and the HRI
    community has examined consent in dyadic human-robot encounters. Neither body of work covers what
    happens when physical robots delegate tasks to other robots in ways that affect humans. This paper
    introduces consent chain degradation (CCD), a conceptual framework for analyzing how the specificity,
    validity, and scope of human consent erodes as authority passes through multi-robot delegation chains.
    We propose a three-layer governance architecture, the Consent Runtime Verification Framework for Embodied
    Agents (CoRVE), which integrates consent scope modeling, delegation chain tracking, and physical irreversibility
    assessment. Three scenarios in healthcare, domestic, and industrial robotics show how CCD arises in
    practice, including a worked numerical example. A regulatory gap analysis covering the EU AI Act,
    the GDPR, the Machinery Regulation, and the Revised Product Liability Directive shows that all four
    instruments leave core CCD dimensions unaddressed.
  concept: consent-in-agentic-ai
  keywords:
  - consent chain degradation
  - CoRVE
  - multi-robot systems
  - embodied AI agents
  - robot ethics
  - delegation
  - EU AI Act
  - GDPR
  summary: >-
    Introduces consent chain degradation (CCD) in multi-robot delegation chains and CoRVE, a runtime consent
    verification architecture for embodied agents.

- slug: adaptive-guidance-cvpr-wad-2026
  title: >-
    When Does Adaptive Guidance Help? Belief-Aware Privileged Distillation for Autonomous Driving Under
    Partial Observability
  authors:
  - me
  date: 2026-06-01
  type: paper-conference
  venue: CVPR 2026 Workshop on Autonomous Driving (WAD)
  venue_short: CVPR 2026 WAD
  arxiv: '2605.26155'
  areas:
  - rl-autonomy
  featured: true
  overview: >-
    Extends Guided Soft Actor-Critic with Belief-Aware GSAC, which scales the privileged-distillation
    coefficient by ensemble disagreement in a driving POMDP. Across three occlusion levels, adaptive guidance
    helps under mild and moderate occlusion; under severe occlusion the coefficient collapses to its minimum
    early ("observability blindness") and a simple linear decay schedule performs best, suggesting that
    much of the benefit comes from scheduling rather than adaptivity.
  abstract: >-
    Guided Soft Actor-Critic (GSAC) distills knowledge from a privileged full-state teacher to a partial-observation
    student for autonomous driving, but uses a fixed distillation coefficient λ regardless of the agent’s
    uncertainty. We present Belief-Aware GSAC (BA-GSAC), which modulates λ via ensemble disagreement,
    and use it as a testbed for a systematic empirical study asking: when does adaptive guidance actually
    help? Evaluating five strategies (fixed λ ∈ {0.01, 0.1}, adaptive, linear decay, and vanilla SAC)
    across three POMDP difficulty levels on Highway-Env, we find that preliminary single-seed runs suggest
    benefits under mild and moderate partial observability, but under severe occlusion (evaluated with
    3 seeds for all methods) the adaptive coefficient collapses to λmin within ∼3K steps. We trace this
    to an observability blindness phenomenon: because the ensemble predicts partial observations, it achieves
    low disagreement even under heavy occlusion, modeling what is visible but unable to detect what is
    missing. We diagnose the root cause and propose an architectural fix (training the ensemble on full-state
    predictions using the guiding actor’s privileged access); while not validated here, we show that even
    with current limitations, the warmup phase provides measurable stabilization (CV=13.3% vs. 29.8% for
    constant λ = 0.01). In fact, a simple deterministic linear decay schedule achieves the best severe-POMDP
    performance across all metrics (mean 116.5, CV=8.9%), suggesting that the scheduling effect, not the
    ensemble, drives the stability benefit. These findings provide practical guidance for designing uncertainty-aware
    teacher-student frameworks and highlight ensemble prediction targets as an important design choice.
  concept: guided-soft-actor-critic
  keywords:
  - Guided Soft Actor-Critic
  - BA-GSAC
  - privileged distillation
  - teacher-student reinforcement learning
  - partial observability
  - POMDP
  - ensemble uncertainty
  - autonomous driving
  summary: >-
    Belief-Aware GSAC adapts the distillation coefficient by ensemble disagreement; under severe occlusion
    this fails through observability blindness, and a linear decay schedule works best.

- slug: chat-to-agent-chi-2026
  title: 'From Chat to Agent: Why Consent Breaks When AI Acts on Your Behalf'
  authors:
  - me
  date: 2026-04-01
  type: paper-conference
  venue: 'ACM CHI 2026 Workshop: Moving Beyond Clicks: Rethinking Consent and User Control in the Age
    of AI'
  venue_short: CHI 2026 Workshop
  areas:
  - agentic-ai-safety
  abstract: >-
    The rapid evolution from conversational chatbots to autonomous AI agents has outpaced consent mechanisms
    designed to protect users. While millions share sensitive information with LLM-based systems, evidence
    shows a widening gap between users’ mental models of data handling and actual platform practices.
    This disconnect deepens as AI browsers navigate the web, handle credentials, and execute transactions.
    This paper argues that consent is structurally broken across the LLM ecosystem and identifies three
    design tensions: personalization versus data minimization, agent autonomy versus user control, and
    transparency versus usability. Building on these tensions, this paper proposes LLM-specific consent
    mechanisms: contextual in-flow transparency, task-scoped permissions, and AI-mediated privacy guardians,
    and highlight their consequences for security, comprehension, and power asymmetries in agentic systems.
  concept: consent-in-agentic-ai
  keywords:
  - consent
  - privacy
  - large language models
  - agentic AI
  - trustworthy AI
  summary: >-
    Argues that consent is structurally broken across the LLM ecosystem as AI moves from chat to action,
    and proposes in-flow transparency, task-scoped permissions and privacy guardians.

