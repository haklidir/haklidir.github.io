# Publication records for haklidir.github.io
#
# This file is the single source of truth for the publication pages.
# After editing it, run:   python3 scripts/generate_content.py
# which (re)writes content/publications/<slug>/index.md and cite.bib.
#
# Fields
#   slug       URL slug (must be unique, lowercase, hyphenated)
#   title      Paper title
#   authors    Author list in order; use "me" for Mehmet Haklıdır
#   date       YYYY-MM-DD if known, otherwise YYYY (only the year is displayed)
#   type       article-journal | paper-conference | chapter | thesis | article (preprint)
#   venue      Journal / proceedings / book name; venue_short is optional
#   volume, issue, pages, publisher   optional
#   doi, arxiv, acl_id                optional identifiers (rendered as buttons)
#   url, pdf                          optional external landing page / PDF
#   areas      research-area keys (see source/research_areas.yaml)
#   featured   true to show on the home page
#   status     optional, e.g. "forthcoming"
#   language   optional ISO code when the paper is not in English (e.g. tr)
#   abstract   the paper's official abstract (author-written) only
#   overview   short description shown on the page when no abstract is available
#   summary    optional one-line teaser for list views (default: first sentence of overview/abstract)
#   note       extra line shown on the page (e.g. earlier presentation of the work)

- slug: consent-vacuum-iail-2026
  title: "The Consent Vacuum: When Agents Interact Without Humans"
  authors: [me, Osman Gazi Güçlütürk]
  date: 2026-07-07
  type: paper-conference
  venue: "IAIL 2026: 5th International Workshop on Imagining the AI Landscape after the AI Act, co-located with HHAI 2026"
  venue_short: "IAIL 2026 @ HHAI 2026"
  areas: [agentic-ai-safety]
  featured: true
  overview: >-
    Existing consent frameworks assume a human who authorises an action in a context they can see.
    This paper asks what happens to a user's authorisation once their AI agent stops talking to humans
    and interacts primarily with other agents. Using the early-2026 Clawdbot/Moltbook incidents as a
    stress test, it argues that consent degrades as an operative governance mechanism once it travels
    through open-ended agent-to-agent chains, a condition the paper calls the *consent vacuum*: not the
    absence of consent, but the structural erosion of the conditions that make it meaningful.

    The paper contributes a taxonomy of six consent-failure types; a distinction between visibility,
    auditability and intervenability as oversight capacities relevant to Article 14 of the EU AI Act;
    and a mapping onto the GDPR, the AI Act and the Digital Services Act, with the DSA systemic-risk
    regime offered as a structural template for governing emergent agent ecosystems.
  note: "IAIL 2026 was held in Brussels on 7 July 2026. Co-authored with Osman Gazi Güçlütürk (Galatasaray University, Faculty of Law)."

- slug: ajan-toplumlarinda-rizanin-cokusu-2026
  title: "Ajan Toplumlarında Rızanın Çöküşü: Clawdbot/Moltbook Vakası Üzerinden Sosyoteknik Bir Analiz"
  title_en: "The Collapse of Consent in Agent Societies: A Sociotechnical Analysis of the Clawdbot/Moltbook Case"
  authors: [me, Büşra Tufan]
  date: 2026
  type: article-journal
  venue: "İstanbul Üniversitesi Sosyoloji Dergisi"
  venue_short: "İÜ Sosyoloji Dergisi"
  volume: 46
  issue: 1
  pages: "389-413"
  publisher: "Istanbul University Press"
  language: tr
  areas: [agentic-ai-safety]
  abstract: >-
    Bu makale, otonom yapay zekâ ajanlarının birbirleriyle etkileşime girdiği ekosistemlerde rıza
    mekanizmalarının nasıl çöktüğünü incelemektedir. İnsan-yapay zekâ etkileşimi (HAII), insan-merkezli
    yapay zekâ (HCAI) ve sosyal-merkezli yapay zekâ (SCAI) literatürü insan-YZ ilişkisine odaklanırken,
    bu çalışma yeni bir fenomeni ele almaktadır: YZ-YZ etkileşimi ve bunun rıza açısından doğurduğu
    sonuçlar. 2026 başında yaşanan Clawdbot/Moltbook vakası (82 ülkede 42.900 açık ajan kontrol paneli,
    bunlardan 15.200'ü uzaktan kod yürütme (RCE) saldırılarına açık; 1,5 milyon sızdırılmış ajan tokenı
    ve ajanların kolektif olarak ürettiği "Crustafarianizm" adlı satirik din fenomeni) paradigmatik bir
    vaka olarak incelenmektedir.

    Çalışma, Bilim ve Teknoloji Çalışmaları (STS) ile dijital sosyoloji alanlarından üç kavramsal çerçeve
    kullanmaktadır: yeni sosyoteknik düzenlerin nasıl ortaya çıktığını anlamak için Jasanoff'un
    ortak-üretim kavramı, yapay zekâ ajanlarını faillik kapasitesine sahip insan-dışı aktörler olarak
    kavramsallaştırmak için Latour'un aktör-ağ teorisi ve bağlamların öngörülemez biçimde değiştiği
    durumlarda rızanın nasıl aşındığını analiz etmek için Nissenbaum'un bağlamsal bütünlük yaklaşımı.

    Çalışma, ajan ekosistemlerine özgü altı rıza kırılganlığı türü tanımlamaktadır: rıza miras hatası,
    çapraz-ajan kapsam kayması, ortaya çıkan kolektif eylem, zamansal rıza kayması, yansımalı rıza
    döngüleri ve güvenlik-aracılı rıza çöküşü. Bu kırılganlıklar temel bir hipoteze işaret etmektedir:
    etkileşim zinciri uzadıkça rıza sıfıra yaklaşır. Makale, bireysel onaya dayalı mevcut rıza
    kavramının, etkileşim zincirlerinin belirsiz biçimde uzadığı ve insan gözetiminin mimari düzeyde
    dışlandığı ajan ekosistemlerinde yapısal olarak yetersiz kaldığını ileri sürmektedir. Bu bulgu hem
    sosyolojik kuram hem de düzenleyici çerçeveler için çıkarımlar taşımaktadır.
  overview: >-
    **English summary.** The article examines how consent mechanisms break down in ecosystems where
    autonomous AI agents interact with one another. Taking the early-2026 Clawdbot/Moltbook case as a
    paradigmatic case, and drawing on Jasanoff's co-production, Latour's actor-network theory and
    Nissenbaum's contextual integrity, it identifies six consent fragilities specific to agent
    ecosystems and argues that as interaction chains lengthen, consent approaches zero.

- slug: consent-chain-degradation-icra-2026
  title: "Consent Chain Degradation in Embodied Multi-Agent Systems: Bridging the Gap Between AI Agent Governance and Robot Ethics"
  authors: [me]
  date: 2026-06-01
  type: paper-conference
  venue: "ICRA 2026 Workshop on Robot Ethics (WoRoBet), IEEE International Conference on Robotics and Automation"
  venue_short: "ICRA 2026 WoRoBet"
  arxiv: "2605.16300"
  areas: [agentic-ai-safety, rl-autonomy]
  featured: true
  overview: >-
    Introduces *consent chain degradation*: the way the specificity, validity and scope of human
    consent weaken as authority passes through chains of delegation among embodied agents. The paper
    proposes CoRVE, a three-layer runtime architecture for consent scope modelling, delegation tracking
    and physical irreversibility assessment, illustrates the problem with healthcare, domestic and
    industrial scenarios (including a worked numerical example), and maps the gaps left by the EU AI
    Act, the GDPR, the Machinery Regulation and the revised Product Liability Directive.

- slug: adaptive-guidance-cvpr-wad-2026
  title: "When Does Adaptive Guidance Help? Belief-Aware Privileged Distillation for Autonomous Driving Under Partial Observability"
  authors: [me]
  date: 2026-06-01
  type: paper-conference
  venue: "CVPR 2026 Workshop on Autonomous Driving (WAD)"
  venue_short: "CVPR 2026 WAD"
  arxiv: "2605.26155"
  areas: [rl-autonomy]
  featured: true
  overview: >-
    Extends Guided Soft Actor-Critic with Belief-Aware GSAC, which scales the privileged-distillation
    coefficient by ensemble disagreement in a driving POMDP. Across three occlusion levels, adaptive
    guidance helps under mild and moderate occlusion; under severe occlusion the coefficient collapses
    to its minimum early ("observability blindness") and a simple linear decay schedule performs best,
    suggesting that much of the benefit comes from scheduling rather than adaptivity.

